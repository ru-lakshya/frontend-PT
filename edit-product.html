<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - Inventory</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
        }


        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        h3 {
            font-size: 1.5rem;
            color: var(--primary);
        }

        nav {
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--primary);
        }


        main {
            display: flex;
            justify-content: center;
            padding: 4rem 2rem;
        }

        form {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        form h2 {
            margin-bottom: 0.5rem;
            color: var(--text-main);
            text-align: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-weight: 500;
            color: var(--text-main);
        }

        input {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            margin-top: 1rem;
            padding: 0.875rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .loading {
            text-align: center;
            color: #64748b;
        }
    </style>
</head>

<body>
    <header>
        <h3>Product Inventory</h3>
        <nav>
            <a href="./index.html">Home</a>
            <a href="./add-product.html">Add Product</a>
        </nav>
    </header>

    <main>
        <div id="loadingMessage" class="loading">Loading product data...</div>
        <form id="editForm" onsubmit="handleFormSubmit(event)" style="display: none;">
            <h2>Edit Product</h2>

            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-group">
                <label for="price">Price ($)</label>
                <input type="number" id="price" name="price" step="0.01" min="0.01" required>
            </div>

            <div class="form-group">
                <label for="rating">Rating (1-5)</label>
                <input type="number" id="rating" name="rating" step="0.1" min="1" max="5" required>
            </div>

            <div class="form-group">
                <label for="thumbnail">Image URL</label>
                <input type="url" id="thumbnail" name="thumbnail">
            </div>

            <button type="submit">Update Product</button>
        </form>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        const API_URL = "http://127.0.0.1:5005/products";

        async function loadProductData() {
            if (!productId) {
                alert("No product ID provided!");
                window.location.href = "./index.html";
                return;
            }

            try {

                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Failed to fetch products");
                const data = await response.json();
                const product = data.products.find(p => p.id == productId);

                if (!product) {
                    alert("Product not found!");
                    window.location.href = "./index.html";
                    return;
                }


                document.getElementById('title').value = product.title;
                document.getElementById('price').value = product.price;
                document.getElementById('rating').value = product.rating;
                if (product.thumbnail && !product.thumbnail.includes("no-pictures.png")) {
                    document.getElementById('thumbnail').value = product.thumbnail;
                }


                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('editForm').style.display = 'flex';

            } catch (error) {
                console.error("Error loading product:", error);
                document.getElementById('loadingMessage').innerText = "Failed to load product data.";
            }
        }


        loadProductData();


        async function handleFormSubmit(e) {
            e.preventDefault();


            const title = e.target.title.value;
            const price = parseFloat(e.target.price.value);
            const rating = parseFloat(e.target.rating.value);
            const thumbnail = e.target.thumbnail.value;

            const payload = { title, price, rating };
            if (thumbnail) {
                payload.thumbnail = thumbnail;
            }

            try {
                const response = await fetch(`${API_URL}/${productId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert('Product updated successfully!');
                    window.location.href = './index.html';
                } else {
                    const data = await response.json();
                    alert(`Failed to update product: ${data.error || 'Unknown error'}`);
                }
            } catch (error) {
                console.error("Error updating product:", error);
                alert('An error occurred. Make sure the backend is running.');
            }
        }
    </script>
</body>

</html>
