<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Paper Theory</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --gold: #efaa29;
            --gold-dark: #805915;
            --bg-white: #ffffff;
            --bg-off: #fcfcfc;
            --text-dark: #1a1a1a;
            --text-muted: #777777;
            --border: #eeeeee;
            --danger: #b44a4a;
            --font-primary: 'Larken', serif;
            --font-secondary: 'HelveticaCustom', Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-secondary);
            background-color: var(--bg-off);
            color: var(--text-dark);
            line-height: 1.6;
        }

        header {
            background: var(--bg-white);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h3 {
            font-family: var(--font-primary);
            font-size: 1.5rem;
        }

        nav {
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        nav a:hover,
        nav a.active {
            color: var(--gold);
        }

        .hero {
            text-align: center;
            padding: 4rem 1rem;
            background: var(--bg-white);
        }

        .hero h1 {
            font-family: var(--font-primary);
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .hero h1 span {
            color: var(--gold);
        }

        .hero p {
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: capitalize;
            font-size: 0.9rem;
        }

        #root {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            padding: 3rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .product-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-grow: 1;
        }

        .product-info h4 {
            font-family: var(--font-primary);
            font-size: 1.2rem;
        }

        .price-rating {
            display: flex;
            justify-content: space-between;
            color: var(--gold-dark);
            font-weight: 600;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
        }

        button,
        .btn {
            padding: 0.6rem;
            border-radius: 2px;
            border: none;
            cursor: pointer;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            flex: 1;
            text-align: center;
            text-decoration: none;
            font-family: var(--font-secondary);
        }

        .btn-primary {
            background: var(--gold);
            color: white;
        }

        .btn-primary:hover {
            background: var(--gold-dark);
        }

        .btn-delete {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-delete:hover {
            background: var(--danger);
            color: white;
        }

        .btn-edit {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        #cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            max-width: 100%;
            height: 100vh;
            background: var(--bg-white);
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.05);
            transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 2rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        #cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        .cart-header h3 {
            font-family: var(--font-primary);
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
        }

        .cart-total {
            padding: 1rem 0;
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
        }

        #checkout-section {
            display: none;
            margin-top: 1rem;
        }

        #checkout-form {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        #checkout-form input {
            padding: 0.75rem;
            border: 1px solid var(--border);
            outline: none;
            font-family: var(--font-secondary);
        }

        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.1);
            visibility: hidden;
            opacity: 0;
            transition: 0.3s;
            z-index: 999;
        }

        .cart-overlay.open {
            visibility: visible;
            opacity: 1;
        }

        footer {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: var(--font-secondary);
        }
    </style>
</head>

<body>
    <header>
        <h3>The Paper Product</h3>
        <nav>
            <a href="./index.html" class="active">Home</a>
            <a href="./add-product.html">Add Product</a>
            <a href="#" onclick="toggleCart(); return false;">Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main id="root">
        <div class="message">Loading products...</div>
    </main>


    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
    <div id="cart-sidebar">
        <div class="cart-header">
            <h3>Cart</h3>
            <button onclick="toggleCart()"
                style="background:none; border:none; font-size:1.5rem; cursor:pointer;">×</button>
        </div>
        <div class="cart-items" id="cart-items">
            <div class="cart-item">
                <div>
                    <p>Premium Graphite Pencil Set (Pack of 12)</p>
                    <p style="font-size:0.8rem; color:var(--text-muted)">₹ 899</p>
                </div>
                <button onclick="removeFromCart(0)"
                    style="background:none; border:none; color:var(--danger); cursor:pointer;">Remove</button>
            </div>
        </div>
        <div class="cart-total">
            <span>Total:</span>
            <span id="cart-total-amount">₹ 899.00</span>
        </div>
        <button class="btn-primary" id="proceed-checkout-btn" onclick="showCheckoutForm()"
            style="display: block;">Checkout</button>

        <div id="checkout-section">
            <form id="checkout-form" onsubmit="handleCheckout(event)">
                <input type="text" id="cust-name" placeholder="Name" required="">
                <input type="text" id="cust-room" placeholder="Room No" required="">
                <input type="text" id="cust-building" placeholder="Building Number" required="">
                <button type="submit" class="btn-primary" style="margin-top:0.5rem">Place Order</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:5005/products";
        const CHECKOUT_URL = "http://localhost:5005/checkout";
        let allProducts = [];
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        
        function renderProducts(products) {
            const root = document.getElementById("root");

            root.innerHTML = "";

            if (!products || products.length === 0) {
                root.innerHTML = '<div class="message">No products found. Add some!</div>';
                return;
            }

            products.forEach(product => {
                const newCard = document.createElement("div");
                newCard.className = "card";

                newCard.innerHTML = `
                    <img src="${product.thumbnail || 'https://aeqpfgrxoydomedttvxx.supabase.co/storage/v1/object/public/images/no-pictures.png'}" alt="${product.title}" onerror="this.src='https://aeqpfgrxoydomedttvxx.supabase.co/storage/v1/object/public/images/no-pictures.png'" />
                    <div class="product-info">
                        <h4>${product.title}</h4>
                        <div class="price-rating">
                            <span class="price">$${product.price}</span>
                            <span>⭐️ ${product.rating}</span>
                        </div>
                        <div class="actions">
                            <button class="btn btn-primary" onclick="addToCart(${product.id})">Add to Cart</button>
                        </div>
                        <div class="actions" style="margin-top: 0.5rem;">
                            <a href="./edit-product.html?id=${product.id}" class="btn btn-edit">Edit</a>
                            <button class="btn btn-delete" onclick="handleDeleteProduct(${product.id})">Delete</button>
                        </div>
                    </div>
                `;
                root.appendChild(newCard);
            });
        }

    
        async function fetchProducts() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Failed to fetch");
                const data = await response.json();
                allProducts = data.products;
                renderProducts(allProducts);
                renderCart();
            } catch (error) {
                console.error("Error fetching products:", error);
                const root = document.getElementById("root");
                root.innerHTML = '<div class="message" style="color: var(--danger);">Failed to load products. Ensure the backend is running.</div>';
            }
        }

        
        async function handleDeleteProduct(productId) {
            
            if (!confirm("Are you sure you want to delete this product?")) return;

            try {
                const response = await fetch(`${API_URL}/${productId}`, {
                    method: 'DELETE',
                });

                if (response.ok) {
                    
                    window.location.reload();
                } else {
                    alert("Failed to delete product.");
                }
            } catch (error) {
                console.error("Error deleting product:", error);
                alert("An error occurred while deleting.");
            }
        }

       

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('open');
            document.getElementById('checkout-section').style.display = 'none';
        }

        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (product) {
                cart.push(product);
                saveCart();
                renderCart(); 
                alert(`${product.title} added to cart!`);
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
            renderCart();
        }

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            document.getElementById('cart-count').innerText = cart.length;
        }

        function renderCart() {
            document.getElementById('cart-count').innerText = cart.length;
            const cartItemsContainer = document.getElementById('cart-items');
            cartItemsContainer.innerHTML = '';

            let total = 0;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: var(--text-muted);">Your cart is empty.</p>';
                document.getElementById('proceed-checkout-btn').style.display = 'none';
            } else {
                document.getElementById('proceed-checkout-btn').style.display = 'block';
                cart.forEach((item, index) => {
                    let priceVal = typeof item.price === 'string' ? parseFloat(item.price.replace(/[^0-9.]/g, '')) : item.price;
                    if (isNaN(priceVal)) priceVal = 0;
                    total += priceVal;

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'cart-item';
                    itemDiv.innerHTML = `
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.title}</div>
                            <div class="cart-item-price">$${priceVal.toFixed(2)}</div>
                        </div>
                        <button class="cart-item-remove" onclick="removeFromCart(${index})">Remove</button>
                    `;
                    cartItemsContainer.appendChild(itemDiv);
                });
            }

            document.getElementById('cart-total-amount').innerText = `$${total.toFixed(2)}`;
        }

        function showCheckoutForm() {
            if (cart.length === 0) return;
            document.getElementById('proceed-checkout-btn').style.display = 'none';
            document.getElementById('checkout-section').style.display = 'block';
        }

        async function handleCheckout(e) {
            e.preventDefault();

            if (cart.length === 0) {
                alert("Cart is empty!");
                return;
            }

            const name = document.getElementById('cust-name').value;
            const room_no = document.getElementById('cust-room').value;
            const building_number = document.getElementById('cust-building').value;

            let total = 0;
            const orderItems = cart.map(item => {
                let priceVal = typeof item.price === 'string' ? parseFloat(item.price.replace(/[^0-9.]/g, '')) : item.price;
                if (isNaN(priceVal)) priceVal = 0;
                total += priceVal;
                return { id: item.id, title: item.title, price: priceVal };
            });

            const payload = {
                name,
                room_no,
                building_number,
                order: orderItems,
                payable_amount: total
            };

            try {
                const response = await fetch(CHECKOUT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("your order will be reach you soon");
                    cart = [];
                    saveCart();
                    renderCart();
                    toggleCart();
                    document.getElementById('checkout-form').reset();
                } else {
                    const data = await response.json();
                    alert(`Checkout failed: ${data.error}`);
                }
            } catch (err) {
                console.error("Checkout error:", err);
                alert("An error occurred during checkout.");
            }
        }

        
        fetchProducts();
    </script>
</body>

</html>
