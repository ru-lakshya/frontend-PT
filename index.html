<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Paper Theory</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
        }


        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        h3 {
            font-size: 1.5rem;
            color: var(--primary);
        }

        nav {
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--primary);
        }

        nav a.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }


        #root {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }


        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid var(--border);
        }

        .product-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-grow: 1;
        }

        .product-info h4 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .price-rating {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .price {
            color: #16a34a;
            font-size: 1.125rem;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
        }


        button,
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            text-decoration: none;
            flex: 1;
        }

        .btn-delete {
            background-color: var(--danger);
            color: white;
        }

        .btn-delete:hover {
            background-color: var(--danger-hover);
        }

        .btn-edit {
            background-color: var(--border);
            color: var(--text-main);
        }

        .btn-edit:hover {
            background-color: #cbd5e1;
        }


        .message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1.25rem;
        }


        #cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            max-width: 100%;
            height: 100vh;
            background: var(--card-bg);
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);
            transition: right 0.3s ease;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        #cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .close-cart {
            cursor: pointer;
            font-size: 1.5rem;
            font-weight: bold;
            background: none;
            border: none;
            color: var(--text-main);
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .cart-item-info {
            flex-grow: 1;
        }

        .cart-item-title {
            font-weight: 500;
        }

        .cart-item-price {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .cart-item-remove {
            color: var(--danger);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .cart-total {
            margin-top: 1rem;
            font-size: 1.25rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            width: 100%;
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }


        #checkout-section {
            display: none;
            margin-top: 1rem;
        }

        #checkout-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        #checkout-form input {
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
        }

        #checkout-form input:focus {
            border-color: var(--primary);
        }
    </style>
</head>

<body>
    <header>
        <h3>The Paper Product</h3>
        <nav>
            <a href="./index.html" class="active">Home</a>
            <a href="./add-product.html">Add Product</a>
            <a href="#" onclick="toggleCart(); return false;">Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main id="root">
        <div class="message">Loading products...</div>
    </main>


    <div id="cart-sidebar">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cart-items">

        </div>
        <div class="cart-total">
            <span>Total:</span>
            <span id="cart-total-amount">$0.00</span>
        </div>

        <button class="btn-primary" id="proceed-checkout-btn" onclick="showCheckoutForm()">Proceed to Checkout</button>

        <div id="checkout-section">
            <h4 style="margin-bottom: 0.5rem;">Checkout</h4>
            <form id="checkout-form" onsubmit="handleCheckout(event)">
                <input type="text" id="cust-name" placeholder="Name" required>
                <input type="text" id="cust-room" placeholder="Room No" required>
                <input type="text" id="cust-building" placeholder="Building Number" required>
                <button type="submit" class="btn-primary">Place Order</button>
            </form>
        </div>
    </div>
    <script>
        const API_URL = "http://localhost:5005/products";
        const CHECKOUT_URL = "http://localhost:5005/checkout";
        let allProducts = [];
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        // Render products to the DOM
        function renderProducts(products) {
            const root = document.getElementById("root");

            // Important fix: Clear root before rendering
            root.innerHTML = "";

            if (!products || products.length === 0) {
                root.innerHTML = '<div class="message">No products found. Add some!</div>';
                return;
            }

            products.forEach(product => {
                const newCard = document.createElement("div");
                newCard.className = "card";

                // Construct the inner HTML for the product card
                newCard.innerHTML = `
                    <img src="${product.thumbnail || 'https://aeqpfgrxoydomedttvxx.supabase.co/storage/v1/object/public/images/no-pictures.png'}" alt="${product.title}" onerror="this.src='https://aeqpfgrxoydomedttvxx.supabase.co/storage/v1/object/public/images/no-pictures.png'" />
                    <div class="product-info">
                        <h4>${product.title}</h4>
                        <div class="price-rating">
                            <span class="price">$${product.price}</span>
                            <span>⭐️ ${product.rating}</span>
                        </div>
                        <div class="actions">
                            <button class="btn btn-primary" onclick="addToCart(${product.id})">Add to Cart</button>
                        </div>
                        <div class="actions" style="margin-top: 0.5rem;">
                            <a href="./edit-product.html?id=${product.id}" class="btn btn-edit">Edit</a>
                            <button class="btn btn-delete" onclick="handleDeleteProduct(${product.id})">Delete</button>
                        </div>
                    </div>
                `;
                root.appendChild(newCard);
            });
        }

        // Fetch product data from the backend
        async function fetchProducts() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Failed to fetch");
                const data = await response.json();
                allProducts = data.products;
                renderProducts(allProducts);
                renderCart(); // Initialize cart UI
            } catch (error) {
                console.error("Error fetching products:", error);
                const root = document.getElementById("root");
                root.innerHTML = '<div class="message" style="color: var(--danger);">Failed to load products. Ensure the backend is running.</div>';
            }
        }

        // Handle deleting a product
        async function handleDeleteProduct(productId) {
            // Add a simple confirmation dialog for better UX
            if (!confirm("Are you sure you want to delete this product?")) return;

            try {
                const response = await fetch(`${API_URL}/${productId}`, {
                    method: 'DELETE',
                });

                if (response.ok) {
                    // Reload the page to refresh the list as per requirements
                    window.location.reload();
                } else {
                    alert("Failed to delete product.");
                }
            } catch (error) {
                console.error("Error deleting product:", error);
                alert("An error occurred while deleting.");
            }
        }

        // --- Cart & Checkout Logic ---

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('open');
            document.getElementById('checkout-section').style.display = 'none';
        }

        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (product) {
                cart.push(product);
                saveCart();
                renderCart();

                // Open sidebar optionally, or just show alert
                // toggleCart(); 
                alert(`${product.title} added to cart!`);
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
            renderCart();
        }

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            document.getElementById('cart-count').innerText = cart.length;
        }

        function renderCart() {
            document.getElementById('cart-count').innerText = cart.length;
            const cartItemsContainer = document.getElementById('cart-items');
            cartItemsContainer.innerHTML = '';

            let total = 0;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: var(--text-muted);">Your cart is empty.</p>';
                document.getElementById('proceed-checkout-btn').style.display = 'none';
            } else {
                document.getElementById('proceed-checkout-btn').style.display = 'block';
                cart.forEach((item, index) => {
                    // Extract numeric price safely (assuming format might be "$29.99" or "29.99")
                    let priceVal = typeof item.price === 'string' ? parseFloat(item.price.replace(/[^0-9.]/g, '')) : item.price;
                    if (isNaN(priceVal)) priceVal = 0;
                    total += priceVal;

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'cart-item';
                    itemDiv.innerHTML = `
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.title}</div>
                            <div class="cart-item-price">$${priceVal.toFixed(2)}</div>
                        </div>
                        <button class="cart-item-remove" onclick="removeFromCart(${index})">Remove</button>
                    `;
                    cartItemsContainer.appendChild(itemDiv);
                });
            }

            document.getElementById('cart-total-amount').innerText = `$${total.toFixed(2)}`;
        }

        function showCheckoutForm() {
            if (cart.length === 0) return;
            document.getElementById('proceed-checkout-btn').style.display = 'none';
            document.getElementById('checkout-section').style.display = 'block';
        }

        async function handleCheckout(e) {
            e.preventDefault();

            if (cart.length === 0) {
                alert("Cart is empty!");
                return;
            }

            const name = document.getElementById('cust-name').value;
            const room_no = document.getElementById('cust-room').value;
            const building_number = document.getElementById('cust-building').value;

            let total = 0;
            const orderItems = cart.map(item => {
                let priceVal = typeof item.price === 'string' ? parseFloat(item.price.replace(/[^0-9.]/g, '')) : item.price;
                if (isNaN(priceVal)) priceVal = 0;
                total += priceVal;
                return { id: item.id, title: item.title, price: priceVal };
            });

            const payload = {
                name,
                room_no,
                building_number,
                order: orderItems,
                payable_amount: total
            };

            try {
                const response = await fetch(CHECKOUT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("your order will be reach you soon");
                    // Clear cart
                    cart = [];
                    saveCart();
                    renderCart();
                    toggleCart();
                    document.getElementById('checkout-form').reset();
                } else {
                    const data = await response.json();
                    alert(`Checkout failed: ${data.error}`);
                }
            } catch (err) {
                console.error("Checkout error:", err);
                alert("An error occurred during checkout.");
            }
        }

        // Initialize application by fetching data
        fetchProducts();
    </script>
</body>

</html>
