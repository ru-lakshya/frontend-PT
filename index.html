<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Paper Theory</title>
    <link rel="stylesheet" href="style.css">
    <style>
        
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        h3 {
            font-size: 1.5rem;
            color: var(--primary);
        }

        nav {
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--primary);
        }

        nav a.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        
        #root {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid var(--border);
        }

        .product-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-grow: 1;
        }

        .product-info h4 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .price-rating {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .price {
            color: #16a34a;
            font-size: 1.125rem;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
        }

        
        button,
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            text-decoration: none;
            flex: 1;
        }

        .btn-delete {
            background-color: var(--danger);
            color: white;
        }

        .btn-delete:hover {
            background-color: var(--danger-hover);
        }

        .btn-edit {
            background-color: var(--border);
            color: var(--text-main);
        }

        .btn-edit:hover {
            background-color: #cbd5e1;
        }

        
        .message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1.25rem;
        }

        
        #cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            max-width: 100%;
            height: 100vh;
            background: var(--card-bg);
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);
            transition: right 0.3s ease;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        #cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .close-cart {
            cursor: pointer;
            font-size: 1.5rem;
            font-weight: bold;
            background: none;
            border: none;
            color: var(--text-main);
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .cart-item-info {
            flex-grow: 1;
        }

        .cart-item-title {
            font-weight: 500;
        }

        .cart-item-price {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .cart-item-remove {
            color: var(--danger);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .cart-total {
            margin-top: 1rem;
            font-size: 1.25rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            width: 100%;
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        
        #checkout-section {
            display: none;
            margin-top: 1rem;
        }

        #checkout-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        #checkout-form input {
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
        }

        #checkout-form input:focus {
            border-color: var(--primary);
        }
    </style>
</head>

<body>
    <header>
        <h3>The Paper Product</h3>
        <nav>
            <a href="./index.html" class="active">Home</a>
            <a href="./add-product.html">Add Product</a>
            <a href="#" onclick="toggleCart(); return false;">Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main id="root">
        <div class="message">Loading products...</div>
    </main>

    
    <div id="cart-sidebar">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cart-items">
            
        </div>
        <div class="cart-total">
            <span>Total:</span>
            <span id="cart-total-amount">$0.00</span>
        </div>

        <button class="btn-primary" id="proceed-checkout-btn" onclick="showCheckoutForm()">Proceed to Checkout</button>

        <div id="checkout-section">
            <h4 style="margin-bottom: 0.5rem;">Checkout</h4>
            <form id="checkout-form" onsubmit="handleCheckout(event)">
                <input type="text" id="cust-name" placeholder="Name" required>
                <input type="text" id="cust-room" placeholder="Room No" required>
                <input type="text" id="cust-building" placeholder="Building Number" required>
                <button type="submit" class="btn-primary">Place Order</button>
            </form>
        </div>
    </div>
    <script>
        const API_URL = "http://localhost:5001/products";
        const CHECKOUT_URL = "http://localhost:5001/checkout";
        let allProducts = [];
    </script>
</body>

</html>
